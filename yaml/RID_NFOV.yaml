# Mapping Parameters #
#====================#

Mapping:
  baseline_dist_thr_ratio: 0.015
  redundant_obs_ratio_thr: 0.85
  num_covisibilities_for_landmark_generation: 15
  num_covisibilities_for_landmark_fusion: 15
  
