# Feature Detection #
#===================#
Feature:
  name: "ORB"
  scale_factor: 1.2
  num_levels: 4              
  ini_fast_threshold: 30 # 0D : 30 -  50D : 30 - 100D : 30
  min_fast_threshold: 25 # 0D : 25 -  50D : 25 - 100D : 25

